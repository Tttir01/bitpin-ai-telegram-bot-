name: Arbitrage worker pipeline tests

on:
  push:
    branches:
      - arbitrage-worker-integration
    paths:
      - "arbitrage-ai-mvp/**"
      - ".github/workflows/arbitrage-worker-tests.yml"
  pull_request:
    paths:
      - "arbitrage-ai-mvp/**"

jobs:
  paper-pipeline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arbitrage-ai-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install worker dependencies
        run: pip install -r requirements-worker.txt
      - name: Run end-to-end paper tests
        run: python tests/test_pipeline.py
