name: Arbitrage paper pipeline CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "arbitrage-ai-mvp/**"
      - "arbitrage_mvp/**"
      - ".github/workflows/arbitrage-paper-ci.yml"
  push:
    branches: [main]
    paths:
      - "arbitrage-ai-mvp/**"
      - "arbitrage_mvp/**"
      - ".github/workflows/arbitrage-paper-ci.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: |
          pip install -r arbitrage-ai-mvp/requirements.txt
          pip install -r arbitrage_mvp/requirements.txt
      - name: Run standalone MVP offline tests
        working-directory: arbitrage_mvp
        run: python -m unittest -v test_mvp.py test_wallex_stream.py test_monitor.py
      - name: Run paper monitor and risk-gate tests
        working-directory: arbitrage-ai-mvp
        run: python -m unittest -v test_risk_gates.py test_monitor.py test_monitor_entrypoint.py test_account_readonly.py test_scanner.py

  wallex-live-diagnostic:
    name: Wallex live Socket.IO and REST metadata diagnostic (non-blocking)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONIOENCODING: utf-8
    continue-on-error: true
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MVP dependencies
        run: pip install -r arbitrage_mvp/requirements.txt
      - name: Probe documented Wallex Hector markets endpoint (read-only)
        working-directory: arbitrage_mvp
        shell: bash
        run: python wallex_hector_probe.py
      - name: Inspect REST depth timestamp metadata and HTTP Date (read-only)
        working-directory: arbitrage_mvp
        shell: bash
        run: python wallex_depth_metadata_probe.py
      - name: Diagnose public Wallex Engine.IO polling handshake
        working-directory: arbitrage_mvp
        shell: bash
        run: |
          python - <<'PY'
          import requests
          for version in (3, 4):
              try:
                  response = requests.get(
                      "https://api.wallex.ir/socket.io/",
                      params={"EIO": version, "transport": "polling"},
                      timeout=10,
                  )
                  print(f"Engine.IO v{version} polling: HTTP {response.status_code}; "
                        f"body={response.text[:240]!r}")
              except requests.RequestException as exc:
                  print(f"Engine.IO v{version} polling: {type(exc).__name__}: {exc}")
          PY
      - name: Probe direct documented WebSocket transport (read-only)
        working-directory: arbitrage_mvp
        shell: bash
        run: python wallex_websocket_probe.py
      - name: Connect to public Wallex depth stream (read-only)
        working-directory: arbitrage_mvp
        shell: bash
        run: python run_wallex_stream.py --wait 8
