name: Arbitrage AI Market Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: arbitrage-ai-market-monitor
  cancel-in-progress: false

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r arbitrage-ai-mvp/requirements.txt

      - name: Restore stability and paper-validation state
        uses: actions/cache/restore@v4
        with:
          path: .cache/arbitrage_state.json
          key: arbitrage-state-${{ github.run_id }}
          restore-keys: |
            arbitrage-state-

      - name: Scan twice and validate public order books
        env:
          CAPITAL_TOMAN: "2000000"
          MIN_NET_PROFIT_PCT: "0.25"
          FEE_WALLEX: "0.25"
          FEE_NOBITEX: "0.25"
          SLIPPAGE_PCT: "0.20"
          TRANSFER_COST_PCT: "0.30"
          ALERT_COOLDOWN_MINUTES: "60"
          PAPER_VALIDATION_COOLDOWN_MINUTES: "30"
          CONFIRM_DELAY_SECONDS: "5"
          ALERT_STATE_FILE: ".cache/arbitrage_state.json"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python arbitrage-ai-mvp/monitor_entrypoint.py

      - name: Persist stability and paper-validation state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/arbitrage_state.json
          key: arbitrage-state-${{ github.run_id }}

      - name: Notify Telegram when the monitor fails
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram failure notification skipped: secrets are not configured."
            exit 0
          fi
          MESSAGE="⚠️ خطا در پایشگر آربیتراژ؛ هیچ سفارش واقعی ثبت نشده است. گزارش اجرا: $WORKFLOW_URL"
          curl --fail --silent --show-error --max-time 15 \
            --request POST \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$MESSAGE" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"
